[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Deep run for the security checklist: FOUNDRY_PROFILE=deep forge test
[profile.deep.invariant]
runs = 10000
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120

[lint]
lint_on_build = false
